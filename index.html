      "Add to Home Screen" — it wants its own apple-* tags. Add these inside
      <head> in your real index.html (I don't have that file — only src/ was
      ever uploaded to me — so this is a snippet to paste in, not a full file).
    -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
